name: Deploy site

# Publishes docs/ to GitHub Pages. The Switzer webfont is not in this repo: its licence
# (ITF Free Font License) allows self-hosting on our own site but not publishing the file
# in a public repository. Each deploy downloads the official file from Fontshare, checks
# it, and adds it to the published site. See docs/assets/fonts/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FONT: Switzer-Variable.woff2
      FONT_ZIP_URL: https://api.fontshare.com/v2/fonts/download/switzer
      # Checksum of the official, unmodified Fontshare file. If Fontshare ships a new
      # version the check fails and the deploy stops: review the new file, then update this.
      FONT_SHA256: d1bf801ffb1a6096def70a7c532255722ad87d948b13a8a586e342f7091f8ee4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Refuse to deploy if the licensed font was committed to this repo
        run: |
          if git ls-files --error-unmatch "docs/assets/fonts/$FONT" >/dev/null 2>&1; then
            echo "::error::$FONT is tracked in this public repo. Remove it from the repo and its history."
            exit 1
          fi

      - name: Download the font from Fontshare
        run: |
          curl --silent --show-error --fail --location --retry 3 --retry-delay 5 \
            --user-agent 'ksharma-website-deploy/1.0' \
            --output switzer.zip "$FONT_ZIP_URL"
          mkdir .fonts
          unzip -q -j switzer.zip "*/WEB/fonts/$FONT" -d .fonts

      - name: Verify the font and place it in the site
        run: |
          echo "$FONT_SHA256  .fonts/$FONT" | sha256sum --check --strict -
          cp ".fonts/$FONT" "docs/assets/fonts/$FONT"
          rm -rf .fonts switzer.zip

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check the live site serves the font
        run: |
          url="https://ksharma.xyz/assets/fonts/$FONT"
          for attempt in 1 2 3 4 5 6; do
            if curl --silent --fail --location --output live.woff2 "$url" \
              && echo "$FONT_SHA256  live.woff2" | sha256sum --check --strict -; then
              exit 0
            fi
            echo "Attempt $attempt: $url not serving the font yet, retrying in 10s"
            sleep 10
          done
          echo "::error::$url does not serve the expected font after deploy"
          exit 1
